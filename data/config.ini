# PeekIn config file
# Edit with: sudo peekin config

[core]
# Show a "looking for your face" message in the login and lock screen
detection_notice = true

# Stay silent after a successful face login
no_confirmation = false

# Skip face login over SSH
abort_if_ssh = true

# Skip face login while the laptop lid is closed
abort_if_lid_closed = true

# Turn face login off in PAM (the peekin command keeps working)
disabled = false

# After recognition, ask for a random head-turn sequence (e.g. LEFT, RIGHT,
# LEFT). Stops photos and still pictures on a phone; a video of you turning
# your head, cut to follow the turns asked for or replayed when the same turns
# come up again, still passes. false unlocks by just looking at the camera:
# faster, but weaker against photos.
movement_challenge = true

# With movement_challenge = false, still ask for the head movement unless the
# camera is an administrator-approved infrared camera (see ir_only). A photo
# on paper or a phone passes a plain match with a colour camera.
require_movement_without_ir = true

# After this many failed face attempts in a row (face not recognised, or head
# movement not followed), face login pauses for 15 minutes or until you log in
# with your password. 0 disables the limit.
max_failed_attempts = 5

# Only "off" is supported by this version: the face scan runs first and
# the password prompt follows if it fails.
workaround = off

[services]
# Where face login may be used. Each place can be switched on or off.
# sudo and sudo -i in a terminal
sudo = true
# The GDM login screen after starting the computer. Note: your keyring then
# stays locked until you enter your password.
login_screen = true
# Unlocking the GNOME lock screen of a running session
lock_screen = true
# Password dialogs of applications and pkexec (experimental)
polkit = false
# Logging in on a local text console, e.g. Ctrl+Alt+F3 (experimental)
console = false

[video]
# Minimum cosine similarity (0 to 1) to an enrolled face; higher is stricter.
# 0.363 is OpenCV's published operating point for SFace.
min_similarity = 0.363

# Scan time: seconds to look for your face before the password is asked for.
# 1 to 10, default 3. With the head-movement check, up to 8 more seconds are
# allowed for the head turns after your face has been recognised.
timeout = 3

# Camera to use. "none" picks one at each scan: an attested infrared camera,
# then the first colour camera, then an unverified infrared one. Or set a fixed
# /dev/v4l/by-id/... (survives a USB port change) or /dev/v4l/by-path/... entry.
device_path = none

# Accept only infrared cameras approved in the settings app or with
# "sudo peekin cameras --attest" (kept in /etc/peekin/ir-profiles.json and
# matched on the USB identity, never the camera name). Not liveness detection.
ir_only = false

# Frames taller than this are downscaled for face detection.
max_height = 320

# Warn when the camera cannot be found
warn_no_device = true

# Capture size; -1 keeps the camera default. 640x480 is enough for faces.
frame_width = 640
frame_height = 480

# Frames with more than this percentage of pixels in the darkest eighth of the
# range are skipped (unlit IR frames). 80 suits infrared cameras, whose lit
# frames are about 60% dark.
dark_threshold = 80

# Raise the built-in screen to full brightness while a colour camera scans a
# dark room, then restore it. Not on the text console or in admin dialogs.
brighten_screen = true

# Capture MJPG instead of raw YUYV, for cameras whose raw frames decode badly.
force_mjpeg = false

# Fixed exposure; -1 keeps auto-exposure. Needs an exposure control
# (v4l2-ctl --list-ctrls).
exposure = -1

# Camera frame rate; -1 keeps the default. Some IR emitters need a specific one.
device_fps = -1

# Frame rotation: 0 landscape only, 1 landscape and portrait, 2 portrait only.
rotate = 0

[snapshots]
# Keep a photo each time a face is seen but not accepted (wrong face, or the
# head movement not followed), in /var/log/peekin; only root and the
# peekin service account can read them, and the settings app shows you
# your own. Attempts without a face and successful logins are never kept.
save_failed = false
# How many photos to keep (1 to 100); the oldest are deleted.
keep = 20

[debug]
# Log a timing report for every attempt (journalctl -b | grep pam_peekin)
end_report = false
