name: Bug report
description: Report a problem with PeekIn
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report security issues privately: [Security policy](https://github.com/christosdaggas/PeekIn/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Lock the screen\n2. Look at the camera\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - sudo
        - Login screen (GDM)
        - Lock screen
        - Administrator dialog (polkit)
        - Text console
        - Settings app
        - peekin command
        - Package installation or upgrade (RPM / DEB)
  - type: input
    id: version
    attributes:
      label: PeekIn version
      description: Output of `peekin version`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution version and desktop
      placeholder: Fedora 44 or Debian 13, GNOME
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera
      description: Model and type (colour or infrared); run `peekin cameras`.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `sudo peekin doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Log
      description: "`journalctl -b | grep -E 'pam_peekin|peekin'` after the problem (remove anything private)"
      render: text
