[package]
name = "peekin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "PeekIn CLI"
license.workspace = true
homepage.workspace = true

[[bin]]
name = "peekin"
path = "src/main.rs"

[[bin]]
name = "peekin-helper"
path = "src/helper.rs"

[dependencies]
peekin-core = { path = "../peekin-core" }
peekin-vision = { path = "../peekin-vision" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
serde_json = "1"

[[example]]
name = "benchmark"
test = true
