[package]
name = "peekin-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "PeekIn settings app (GTK4 + libadwaita)"
license.workspace = true
homepage.workspace = true

[[bin]]
name = "peekin-settings"
path = "src/main.rs"

[dependencies]
peekin-core = { path = "../peekin-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2"
serde_json = "1"
peekin-vision = { path = "../peekin-vision" }
libc = "0.2"

[build-dependencies]
glib-build-tools = "0.22"
